<!-- TOP APP BAR -->
<header class="fixed top-0 left-0 w-full z-40 flex justify-between items-center px-margin py-space-sm bg-surface/85 backdrop-blur-md shadow-sm">
<div class="flex items-center gap-space-sm">
<a aria-label="Voltar" class="w-10 h-10 rounded-full flex items-center justify-center text-primary hover:bg-surface-container-high transition-colors duration-150 active:scale-95" href="index.html">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</a>
<div>
<span class="text-label-sm font-label-sm text-primary uppercase tracking-wider block">WanderGroup</span>
<h1 class="text-headline-md font-headline-md font-bold text-primary leading-tight">Novo Grupo</h1>
</div>
</div>

<main class="pt-20 max-w-md mx-auto px-margin space-y-space-lg">
<!-- INTRO -->
<section class="bg-surface-container-lowest rounded-3xl p-5 shadow-ambient border border-primary/10 space-y-4">
<div class="flex items-center gap-2.5">
<div class="w-10 h-10 rounded-full bg-secondary-container/15 flex items-center justify-center text-secondary-container">
<span class="material-symbols-outlined text-[22px]">group_add</span>
</div>
<div>
<h2 class="text-headline-md font-headline-md text-on-surface">Comece um novo grupo</h2>
<p class="text-body-sm font-body-sm text-on-surface-variant">Crie um círculo para planejar a próxima viagem juntos.</p>
</div>
</div>
<!-- Group name -->
<div class="space-y-2">
<label class="block text-label-md font-label-md text-on-surface" for="nomeGrupo">Nome do grupo</label>
<input class="w-full h-[52px] px-4 rounded-2xl bg-surface-container-low border border-outline-variant/30 focus:border-secondary-container focus:ring-0 text-body-md font-body-md" id="nomeGrupo" placeholder="Ex.: Turma do Churrasco" type="text"/>
</div>
<!-- Member add -->
<div class="space-y-2">
<span class="block text-label-md font-label-md text-on-surface">Convidar amigos</span>
<div class="flex gap-2">
<div class="relative flex-1">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[18px]">person_add</span>
<input class="w-full h-11 pl-9 pr-3 rounded-xl bg-surface-container-low border border-outline-variant/30 text-body-sm font-body-sm focus:border-primary focus:ring-0" placeholder="E-mail ou WhatsApp..." type="text"/>
</div>
<button class="h-11 px-4 bg-surface-container text-primary font-label-md text-label-md rounded-xl hover:bg-surface-container-high active:scale-95 transition-transform">Adicionar</button>
</div>
<!-- Pending chips -->
<div class="flex flex-wrap gap-2">
<span class="inline-flex items-center gap-1.5 bg-surface-container-low rounded-full pl-1 pr-2 py-1 text-label-sm font-label-sm">
<span class="material-symbols-outlined text-[16px] text-primary">person</span> Camila
<button aria-label="Remover Camila" class="text-outline hover:text-error transition-colors"><span class="material-symbols-outlined text-[16px]">close</span></button>
</span>
<span class="inline-flex items-center gap-1.5 bg-surface-container-low rounded-full pl-1 pr-2 py-1 text-label-sm font-label-sm">
<span class="material-symbols-outlined text-[16px] text-primary">person</span> Bruno
<button aria-label="Remover Bruno" class="text-outline hover:text-error transition-colors"><span class="material-symbols-outlined text-[16px]">close</span></button>
</span>
</div>
</div>
<!-- Invite link -->
<button class="w-full py-2.5 px-4 rounded-xl border border-secondary-container/30 bg-secondary-container/5 text-secondary font-label-md font-label-md flex items-center justify-center gap-2 hover:bg-secondary-container/10 active:scale-98 transition-all">
<span class="material-symbols-outlined text-[20px]">share</span>
+ Gerar link de convite
</button>
<!-- Create -->
<button class="w-full min-h-[48px] py-3.5 px-6 rounded-full bg-secondary-container text-on-secondary font-headline-sm font-headline-sm flex items-center justify-center gap-2 shadow-ambient active:scale-[0.98] transition-transform duration-150">
<span>Criar grupo</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>

<div class="flex items-center justify-between">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-[20px]">groups</span>

<div class="space-y-2">
<button class="w-full bg-surface-container-lowest rounded-2xl p-3.5 shadow-ambient border border-outline-variant/20 flex items-center gap-3 hover:bg-surface-container-low transition-colors">
<span class="w-11 h-11 rounded-xl bg-primary-container/10 text-primary flex items-center justify-center">
<span class="material-symbols-outlined text-[22px]">flight_takeoff</span>
</span>
<div class="flex-1 text-left min-w-0">
<p class="text-label-md font-label-md font-bold text-on-surface">Rio de Janeiro com os Amigos</p>
<p class="text-body-sm font-body-sm text-on-surface-variant">5 membros • ativo</p>
</div>
<span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
</button>
<button class="w-full bg-surface-container-lowest rounded-2xl p-3.5 shadow-ambient border border-outline-variant/20 flex items-center gap-3 hover:bg-surface-container-low transition-colors">
<span class="w-11 h-11 rounded-xl bg-secondary-fixed text-secondary flex items-center justify-center">
<span class="material-symbols-outlined text-[22px]">hiking</span>
</span>
<div class="flex-1 text-left min-w-0">
<p class="text-label-md font-label-md font-bold text-on-surface">Planejando: Patagônia</p>
<p class="text-body-sm font-body-sm text-on-surface-variant">4 membros • em construção</p>
</div>
<span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
</button>
</div>
