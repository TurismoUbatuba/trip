<body class="bg-background text-on-surface antialiased min-h-screen pb-28">
<header class="fixed top-0 left-0 w-full z-40 flex justify-between items-center gap-2 px-margin py-space-sm bg-surface/85 backdrop-blur-md shadow-sm">
<div class="flex items-center gap-space-sm min-w-0">
<a aria-label="Voltar para Passeios" class="w-10 h-10 rounded-full flex items-center justify-center text-primary hover:bg-surface-container-high transition-colors duration-150 active:scale-95 shrink-0" href="votacao.html">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</a>
<div class="min-w-0">
<span class="text-label-sm font-label-sm text-primary uppercase tracking-wider block">WanderGroup</span>
<h1 class="text-headline-md font-headline-md font-bold text-primary leading-tight truncate">Sugerir Passeio</h1>
</div>
</div>
</header>
<main class="pt-20 max-w-md mx-auto px-margin space-y-space-lg">
<!-- INTRO -->
<section class="bg-surface-container-lowest rounded-3xl p-5 shadow-ambient border border-primary/10 space-y-4">
<div class="flex items-center gap-2.5">
<div class="w-10 h-10 rounded-full bg-secondary-container/15 flex items-center justify-center text-secondary-container">
<span class="material-symbols-outlined text-[22px]">add_location_alt</span>
</div>
<div>
<h2 class="text-headline-md font-headline-md text-on-surface">Proponha uma experiência</h2>
<p class="text-body-sm font-body-sm text-on-surface-variant">O grupo vai votar na sua sugestão.</p>
</div>
</div>
<!-- Nome -->
<div class="space-y-2">
<label class="block text-label-md font-label-md text-on-surface" for="nomePasseio">Nome do passeio</label>
<input class="w-full h-[52px] px-4 rounded-2xl bg-surface-container-low border border-outline-variant/30 focus:border-secondary-container focus:ring-0 text-body-md font-body-md" id="nomePasseio" placeholder="Ex.: Passeio de caiaque na Lagoa" type="text"/>
</div>
<!-- Categoria -->
<div class="space-y-2">
<span class="block text-label-md font-label-md text-on-surface">Categoria</span>
<div class="flex flex-wrap gap-2">
<button class="h-[34px] px-3.5 rounded-full bg-primary text-on-primary text-label-sm font-label-sm flex items-center gap-1.5 shadow-sm active:scale-95 transition-all">
<span class="material-symbols-outlined text-[15px]">hiking</span> Natureza
</button>
<button class="h-[34px] px-3.5 rounded-full bg-surface-container-lowest border border-outline-variant text-on-surface-variant text-label-sm font-label-sm flex items-center gap-1.5 hover:bg-surface-container-low active:scale-95 transition-all">
<span class="material-symbols-outlined text-[15px]">sailing</span> Náutico
</button>
<button class="h-[34px] px-3.5 rounded-full bg-surface-container-lowest border border-outline-variant text-on-surface-variant text-label-sm font-label-sm flex items-center gap-1.5 hover:bg-surface-container-low active:scale-95 transition-all">
<span class="material-symbols-outlined text-[15px]">restaurant</span> Gastronomia
</button>
<button class="h-[34px] px-3.5 rounded-full bg-surface-container-lowest border border-outline-variant text-on-surface-variant text-label-sm font-label-sm flex items-center gap-1.5 hover:bg-surface-container-low active:scale-95 transition-all">
<span class="material-symbols-outlined text-[15px]">nightlife</span> Vida Noturna
</button>
<button class="h-[34px] px-3.5 rounded-full bg-surface-container-lowest border border-outline-variant text-on-surface-variant text-label-sm font-label-sm flex items-center gap-1.5 hover:bg-surface-container-low active:scale-95 transition-all">
<span class="material-symbols-outlined text-[15px]">museum</span> Cultura
</button>
</div>
</div>
<!-- Custo -->
<div class="space-y-2">
<label class="block text-label-md font-label-md text-on-surface" for="custoPasseio">Custo por pessoa (R$)</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-outline text-[18px]">payments</span>
<input class="w-full h-[52px] pl-11 pr-4 rounded-2xl bg-surface-container-low border border-outline-variant/30 focus:border-secondary-container focus:ring-0 text-body-md font-body-md" id="custoPasseio" placeholder="0 = gratuito" type="number"/>
</div>
</div>
<!-- Duração -->
<div class="space-y-2">
<label class="block text-label-md font-label-md text-on-surface" for="duracaoPasseio">Duração estimada</label>
<select class="w-full h-[52px] px-4 rounded-2xl bg-surface-container-low border border-outline-variant/30 focus:border-primary focus:ring-0 text-body-md font-body-md" id="duracaoPasseio">
<option>Menos de 2 horas</option>
<option>Meio período (2–4 h)</option>
<option>Dia inteiro</option>
<option>Atividade noturna</option>
</select>
</div>
<!-- Dia sugerido -->
<div class="space-y-2">
<label class="block text-label-md font-label-md text-on-surface" for="diaPasseio">Melhor dia do roteiro</label>
<select class="w-full h-[52px] px-4 rounded-2xl bg-surface-container-low border border-outline-variant/30 focus:border-primary focus:ring-0 text-body-md font-body-md" id="diaPasseio">
<option>Qualquer dia</option>
<option>Sex 14/11 - Dia 1</option>
<option selected="">Sáb 15/11 - Dia 2</option>
<option>Dom 16/11 - Dia 3</option>
<option>Seg 17/11 - Dia 4</option>
</select>
</div>
<!-- Descricao -->
<div class="space-y-2">
<label class="block text-label-md font-label-md text-on-surface" for="descPasseio">Por que o grupo vai amar?</label>
<textarea class="w-full min-h-[96px] px-4 py-3 rounded-2xl bg-surface-container-low border border-outline-variant/30 focus:border-secondary-container focus:ring-0 text-body-md font-body-md resize-none" id="descPasseio" placeholder="Conte um pouco da experiência..."></textarea>
</div>
<!-- Foto -->
<button class="w-full py-3 rounded-2xl border-2 border-dashed border-outline-variant/50 text-primary text-label-md font-label-md flex items-center justify-center gap-1.5 hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-[18px]">add_photo_alternate</span>
Adicionar foto
</button>
</section>
<!-- SUBMIT -->
<div class="pb-2">
<button class="w-full min-h-[52px] py-3.5 px-6 rounded-full bg-secondary-container text-on-secondary font-headline-sm font-headline-sm flex items-center justify-center gap-2 shadow-ambient active:scale-[0.98] transition-transform duration-150" onclick="window.location.href='votacao.html'">
<span class="material-symbols-outlined text-[20px]">how_to_vote</span>
Enviar para votação
</button>
<p class="text-center text-[11px] text-outline mt-2">Todos os membros do grupo serão notificados para votar.</p>
</div>
</main>

<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-margin py-space-xs pb-safe bg-surface-container-lowest/95 backdrop-blur-md shadow-[0_-4px_16px_-2px_rgba(10,77,104,0.06)]">

</a>

<span class="material-symbols-outlined text-[22px]">view_timeline</span><span class="text-label-sm font-label-sm">Roteiro</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-space-md py-space-xs hover:text-primary transition-colors duration-150 active:scale-95" href="perfil.html">
<span class="material-symbols-outlined text-[22px]">account_circle</span><span class="text-label-sm font-label-sm">Perfil</span>
