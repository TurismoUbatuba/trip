<!-- Interactive feedback micro-interactions -->
<script>
    let dadosVotacao = null;

    async function carregarDados() {
      try {
        const resp = await fetch('json/votacao.json');
        dadosVotacao = await resp.json();
        renderizarPagina();
      } catch (e) {
        console.error('Erro ao carregar votacao.json:', e);
      }
    }

    function getViajante(id) {
      return dadosVotacao.viajantes.find(v => v.id === id);
    }

    function renderizarAvatar(viajante, size) {
      const sz = size || 'w-8 h-8';
      return `<div class="${sz} rounded-full border-2 border-surface-container-lowest overflow-hidden" title="${viajante.nome}">
        <img class="w-full h-full object-cover" alt="${viajante.avatarAlt}" src="${viajante.avatar}"/>
      </div>`;
    }

    function renderizarAvataresStack(ids, size) {
      const offset = size === 'small' ? '-space-x-1.5' : '-space-x-2';
      return `<div class="flex items-center ${offset}">${ids.map(id => renderizarAvatar(getViajante(id), size === 'small' ? 'w-7 h-7' : 'w-8 h-8')).join('')}</div>`;
    }

    function renderizarHeader() {
      const g = dadosVotacao.grupo;
      document.getElementById('header-avatar').src = g.avatar;
      document.getElementById('header-avatar').alt = g.avatarAlt;
      document.getElementById('header-nome').textContent = g.nome;
      document.getElementById('header-destino').textContent = g.destino;
      document.getElementById('header-viajantes').textContent = g.totalViajantes;
    }

    function renderizarPageHeader() {
      const p = dadosVotacao.pagina;
      document.getElementById('page-titulo').textContent = p.titulo;
      document.getElementById('page-subtitulo').textContent = p.subtitulo;
      document.getElementById('page-total-selecionados').textContent = `${p.totalSelecionados} selecionados`;
      document.getElementById('footer-total-selecionados').textContent = p.totalSelecionados;
    }

    function renderizarCategorias() {
      const container = document.getElementById('categorias-container');
      container.innerHTML = dadosVotacao.categorias.map((cat, i) => {
        const isActive = i === 0;
        const activeCls = isActive ? 'bg-primary text-on-primary shadow-sm' : 'bg-surface-container-lowest border border-outline-variant text-on-surface-variant hover:text-primary';
        const countBadge = cat.count ? `<span class="w-4 h-4 rounded-full ${isActive ? 'bg-primary-fixed text-primary' : 'bg-secondary-container/20 text-secondary'} text-[10px] flex items-center justify-center font-bold">${cat.count}</span>` : '';
        return `<button class="h-[34px] px-${isActive ? '4' : '3.5'} rounded-full ${activeCls} text-label-sm font-label-sm whitespace-nowrap ${isActive ? '' : 'flex'} items-center gap-1.5 ${isActive ? 'shadow-sm' : ''} active:scale-95 transition-transform">
          <span class="material-symbols-outlined text-sm">${cat.icone}</span>
          ${cat.nome}
          ${countBadge}
        </button>`;
      }).join('');
    }

    function renderizarBadgeStatus(badge) {
      if (!badge) return '';
      const colorMap = {
        'aprovado': 'bg-emerald-600/90 text-white',
        'votacao-ativa': 'bg-secondary-container text-on-secondary',
        'confirmado-agenda': 'bg-primary text-on-primary'
      };
      return `<span class="px-2.5 py-1 rounded-full ${colorMap[badge.tipo] || 'bg-surface/85 text-primary'} text-label-sm font-label-sm font-bold flex items-center gap-1 shadow-sm">
        <span class="material-symbols-outlined text-xs">${badge.icone}</span>
        ${badge.label}
      </span>`;
    }

    function renderizarSugeridoPor(sugerido) {
      if (!sugerido) return '';
      const viajante = getViajante(sugerido.viajanteId);
      return `<div class="flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface/90 backdrop-blur-md shadow-sm">
        <div class="w-5 h-5 rounded-full overflow-hidden">
          <img class="w-full h-full object-cover" alt="${viajante.avatarAlt}" src="${viajante.avatar}"/>
        </div>
        <span class="text-label-sm font-label-sm text-on-surface font-semibold">${viajante.nome} sugeriu ${sugerido.tempo}</span>
      </div>`;
    }

    function renderizarVotacao(votacao) {
      if (!votacao) return '';
      const avataresHtml = renderizarAvataresStack(votacao.avatares, 'small');
      const pendingHtml = votacao.pendente ? votacao.pendente.map(id => {
        const v = getViajante(id);
        return `<div class="w-7 h-7 rounded-full border-2 border-surface-container-lowest bg-surface-container-highest flex items-center justify-center text-outline text-[11px] font-bold" title="${v.nome} (Pendente)">?</div>`;
      }).join('') : '';

      let statusText = '';
      let statusColor = '';
      if (votacao.status === 'unanimidade') {
        statusText = votacao.sublabel;
        statusColor = 'text-emerald-700';
      } else if (votacao.status === 'parcial') {
        statusText = votacao.sublabel;
        statusColor = 'text-on-surface-variant';
      } else if (votacao.status === 'votos') {
        statusColor = 'text-on-surface';
      }

      const pctBadge = votacao.porcentagem !== null ? `<span class="px-2 py-0.5 rounded-full bg-secondary-container/15 text-secondary text-label-sm font-label-sm font-bold">${votacao.porcentagem}% aprovação</span>` : '';

      return `<div class="bg-surface-container-low rounded-xl p-3 space-y-3">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2">
            <div class="flex items-center -space-x-2">
              ${avataresHtml}
              ${pendingHtml}
            </div>
            <div>
              <p class="text-label-sm font-label-sm text-on-surface font-bold">${votacao.label}</p>
              ${statusText ? `<p class="text-body-sm font-body-sm ${statusColor} font-semibold flex items-center gap-1">
                ${votacao.sublabelIcone ? `<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">${votacao.sublabelIcone}</span>` : ''}
                ${statusText}
              </p>` : ''}
            </div>
          </div>
          ${pctBadge}
        </div>
      </div>`;
    }

    function renderizarCard(passeio) {
      const categoriasTopo = [];
      if (passeio.categoriaLabel) {
        categoriasTopo.push(`<span class="px-2.5 py-1 rounded-full bg-surface/85 backdrop-blur-md text-primary text-label-sm font-label-sm flex items-center gap-1 shadow-sm">
          <span class="material-symbols-outlined text-xs text-primary">${passeio.categoriaIcone}</span>
          ${passeio.categoriaLabel}
        </span>`);
      }
      categoriasTopo.push(renderizarBadgeStatus(passeio.statusBadge));

      const sugestaoBadge = renderizarSugeridoPor(passeio.sugeridoPor);

      const favoritadoIcon = passeio.favoritado
        ? `<span class="material-symbols-outlined text-xl" style="font-variation-settings: 'FILL' 1;">favorite</span>`
        : `<span class="material-symbols-outlined text-xl">favorite_border</span>`;
      const favoritadoColor = passeio.favoritado ? 'text-secondary-container' : 'text-outline hover:text-secondary-container';

      const tagsHtml = passeio.tags ? passeio.tags.map(tag => {
        if (typeof tag === 'string') {
          return `<span class="text-label-sm font-label-sm text-primary font-bold bg-primary-fixed/40 px-2 py-0.5 rounded">${tag}</span>`;
        }
        return `<span class="text-label-sm font-label-sm text-on-surface-variant flex items-center gap-1">
          <span class="material-symbols-outlined text-amber-500 text-sm" style="font-variation-settings: 'FILL' 1;">${tag.icone}</span>
          ${tag.texto}
        </span>`;
      }).join('') : '';

      const duracaoHtml = passeio.duracao ? `<span class="flex items-center gap-1 text-on-surface font-medium">
        <span class="material-symbols-outlined text-primary text-base">schedule</span>
        ${passeio.duracao}
      </span><span>•</span>` : '';

      const duracaoCustomHtml = passeio.duracaoCustom ? `<span class="flex items-center gap-1 text-on-surface font-medium">
        <span class="material-symbols-outlined text-primary text-base">${passeio.duracaoCustom.icone}</span>
        ${passeio.duracaoCustom.texto}
      </span>` : '';

      const avaliacaoHtml = passeio.avaliacao ? `<span class="flex items-center gap-1 text-on-surface font-medium">
        <span class="material-symbols-outlined text-amber-500 text-base" style="font-variation-settings: 'FILL' 1;">star</span>
        ${passeio.avaliacao.nota} <span class="text-on-surface-variant font-normal">(${passeio.avaliacao.total} avaliações)</span>
      </span>` : '';

      const precoHtml = `<div class="text-right">
        ${passeio.precoLabel ? `<span class="text-label-sm font-label-sm text-surface-container-high block">${passeio.precoLabel}</span>` : ''}
        <span class="text-headline-sm font-headline-sm font-extrabold text-white">${passeio.preco}</span>
        ${passeio.precoPorPessoa ? '<span class="text-label-sm font-label-sm text-surface-container-high">/ pessoa</span>' : ''}
        ${passeio.precoExtra ? `<span class="text-label-sm font-label-sm text-surface-container-high block">${passeio.precoExtra}</span>` : ''}
      </div>`;

      const topBadges = categoriasTopo.filter(Boolean).length > 0
        ? `<div class="absolute top-3 left-3 flex items-center gap-2">${categoriasTopo.filter(Boolean).join('')}</div>`
        : (sugestaoBadge ? `<div class="absolute top-3 left-3">${sugestaoBadge}</div>` : '');

      const specsHtml = (passeio.duracao || passeio.duracaoCustom || passeio.avaliacao || tagsHtml)
        ? `<div class="flex items-center justify-between text-body-sm font-body-sm text-on-surface-variant border-b border-outline-variant/30 pb-3">
            <div class="flex items-center gap-3">
              ${duracaoHtml}
              ${duracaoCustomHtml}
              ${avaliacaoHtml}
            </div>
            ${tagsHtml}
          </div>` : '';

      const votacaoHtml = renderizarVotacao(passeio.votacao);

      let acaoHtml = '';
      if (passeio.acaoPrincipal) {
        const a = passeio.acaoPrincipal;
        if (a.tipo === 'adicionado') {
          acaoHtml = `<button class="w-full sm:w-auto h-11 px-4 rounded-full bg-${a.cor} text-white font-label-md font-label-md flex items-center justify-center gap-1.5 shadow-sm active:scale-95 transition-all" onclick="window.location.href='${a.link}'">
            <span class="material-symbols-outlined text-lg">${a.icone}</span>
            ${a.label}
          </button>`;
        } else if (a.tipo === 'votar-adicionar') {
          acaoHtml = `<div class="grid grid-cols-2 gap-2 pt-1">
            <button class="h-11 rounded-full bg-surface-container-lowest border border-secondary-container/40 text-secondary font-label-md font-label-md flex items-center justify-center gap-1.5 hover:bg-secondary-container/10 active:scale-95 transition-all">
              <span class="material-symbols-outlined text-lg text-secondary-container" style="font-variation-settings: 'FILL' 1;">${a.iconeVotar}</span>
              ${a.labelVotar}
            </button>
            <button class="h-11 rounded-full bg-primary text-on-primary font-label-md font-label-md flex items-center justify-center gap-1.5 hover:bg-primary-container active:scale-95 transition-all shadow-sm" onclick="window.location.href='${a.link}'">
              <span class="material-symbols-outlined text-lg">${a.iconeAdicionar}</span>
              ${a.labelAdicionar}
            </button>
          </div>`;
        } else if (a.tipo === 'votar') {
          acaoHtml = `<button class="h-10 px-5 rounded-full bg-${a.cor} text-on-secondary font-label-md font-label-md flex items-center gap-1.5 shadow-sm active:scale-95 transition-all hover:opacity-95">
            <span class="material-symbols-outlined text-lg">${a.icone}</span>
            ${a.label}
          </button>`;
        }
      }

      const cardBodyContent = [];
      if (specsHtml) cardBodyContent.push(specsHtml);
      if (votacaoHtml) cardBodyContent.push(votacaoHtml);
      if (acaoHtml) cardBodyContent.push(acaoHtml);

      const cardBody = cardBodyContent.length > 0
        ? `<div class="p-4 space-y-3.5">${cardBodyContent.join('')}</div>`
        : '';

      // Special case: Cristo Redentor with voucher
      if (passeio.voucher) {
        return `<article class="bg-surface-container-lowest rounded-2xl overflow-hidden card-shadow border border-outline-variant/30 transition-all hover:translate-y-[-2px]">
          <div class="relative w-full aspect-[16/10] overflow-hidden">
            <img class="w-full h-full object-cover" alt="${passeio.imagemAlt}" src="${passeio.imagem}"/>
            <div class="absolute inset-0 bg-gradient-to-t from-on-surface/70 via-transparent to-transparent"></div>
            ${topBadges}
            <div class="absolute bottom-3 left-3 right-3 text-white flex items-end justify-between">
              <div>
                <span class="text-label-sm font-label-sm uppercase tracking-wider text-primary-fixed font-bold">${passeio.localizacao}</span>
                <h3 class="text-headline-md font-headline-md text-white font-bold leading-snug">${passeio.titulo}</h3>
              </div>
              ${precoHtml}
            </div>
          </div>
          <div class="p-4 flex items-center justify-between bg-surface-container-lowest">
            <div class="flex items-center gap-2">
              <span class="w-8 h-8 rounded-full bg-primary-fixed/50 text-primary flex items-center justify-center">
                <span class="material-symbols-outlined text-lg">${passeio.voucher.icone}</span>
              </span>
              <div>
                <p class="text-label-md font-label-md text-on-surface font-bold">${passeio.voucher.label}</p>
                <p class="text-body-sm font-body-sm text-on-surface-variant">${passeio.voucher.sublabel}</p>
              </div>
            </div>
            <button class="px-3 py-1.5 rounded-full bg-surface-container-high text-primary hover:bg-surface-container font-label-sm font-label-sm flex items-center gap-1 transition-colors" onclick="window.location.href='${passeio.voucher.link}'">
              ${passeio.voucher.botaoLabel}
              <span class="material-symbols-outlined text-xs">arrow_forward</span>
            </button>
          </div>
        </article>`;
      }

      return `<article class="bg-surface-container-lowest rounded-2xl overflow-hidden card-shadow border border-outline-variant/30 transition-all hover:translate-y-[-2px]">
        <div class="relative w-full aspect-[16/10] overflow-hidden">
          <img class="w-full h-full object-cover" alt="${passeio.imagemAlt}" src="${passeio.imagem}"/>
          <div class="absolute inset-0 bg-gradient-to-t from-on-surface/70 via-transparent to-transparent"></div>
          ${topBadges}
          <button aria-label="Favoritar" class="absolute top-3 right-3 w-10 h-10 rounded-full bg-surface/85 backdrop-blur-md flex items-center justify-center ${favoritadoColor} shadow-sm active:scale-95 transition-transform">
            ${favoritadoIcon}
          </button>
          <div class="absolute bottom-3 left-3 right-3 text-white flex items-end justify-between">
            <div>
              <span class="text-label-sm font-label-sm uppercase tracking-wider text-primary-fixed font-bold">${passeio.localizacao}</span>
              <h3 class="text-headline-md font-headline-md text-white font-bold leading-snug">${passeio.titulo}</h3>
            </div>
            ${precoHtml}
          </div>
        </div>
        ${cardBody}
      </article>`;
    }

    function renderizarPagina() {
      renderizarHeader();
      renderizarPageHeader();
      renderizarCategorias();
      document.getElementById('passeios-container').innerHTML = dadosVotacao.passeios.map(renderizarCard).join('');
    }

    document.addEventListener('DOMContentLoaded', () => {
      carregarDados();
    });
  </script>
</body></html>
