<!-- ═══════════════════ DYNAMIC RENDERING ENGINE ═══════════════════ -->
<script>
(function() {
  'use strict';

  const JSON_PATH = 'json/roteiro.json';

  /* ── Mapeamentos visuais ── */
  const STATUS_ESTILO = {
    confirmado: { badgeCls: 'bg-emerald-100 text-emerald-800',  icon: 'verified' },
    aprovado:   { badgeCls: 'bg-amber-100 text-amber-900',     icon: 'thumb_up' },
    destaque:   { badgeCls: 'bg-secondary-fixed text-on-secondary-fixed-variant', icon: 'favorite' },
    flexivel:   { badgeCls: 'bg-surface-container-high text-on-surface-variant',  icon: null }
  };
  const BORDA_NOHO = {
    primary:             'border-primary text-primary',
    'primary-container': 'border-primary-container text-primary-container',
    'secondary-container':'border-secondary-container text-secondary-container',
    'outline-variant':   'border-outline-variant text-tertiary'
  };

  let dados = null;
  let diaAtivo = 1;

  /* ── Helpers ── */
  const $ = id => document.getElementById(id);
  const cardShadow = 'shadow-[0_4px_16px_-2px_rgba(10,77,104,0.06),0_2px_6px_-1px_rgba(10,77,104,0.04)]';

  function avatarsHtml(avatares, max) {
    max = max || 4;
    const visiveis = avatares.slice(0, max);
    const restante = avatares.length - max;
    const imgs = visiveis.map(a =>
      `<img alt="${a.alt || ''}" class="w-6 h-6 rounded-full object-cover ring-2 ring-white" src="${a.src}"/>`
    ).join('');
    const badge = restante > 0
      ? `<div class="w-6 h-6 rounded-full bg-secondary-fixed text-on-secondary-fixed text-[10px] font-bold flex items-center justify-center ring-2 ring-white">+${restante}</div>`
      : '';
    return imgs + badge;
  }

  /* ── Render: Header ── */
  function renderHeader() {
    const v = dados.viagem;
    const t = dados.viajantes;
    const max = 4;
    const extra = t.length - max;
    const avatars = t.slice(0, max).map(p =>
      `<img alt="${p.nome}" class="w-7 h-7 rounded-full object-cover ring-2 ring-white" src="${p.avatar}" title="${p.nome}"/>`
    ).join('');
    const extraBadge = extra > 0
      ? `<div class="w-7 h-7 rounded-full bg-secondary-fixed text-on-secondary-fixed text-label-sm font-label-sm font-bold flex items-center justify-center ring-2 ring-white">+${extra}</div>`
      : '';

    $('secao-header').innerHTML = `
    <section class="bg-surface-container-lowest rounded-xl p-space-md ${cardShadow} mt-2 transition-all">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-space-md">
        <div>
          <div class="flex items-center gap-2 mb-1">
            <span class="px-2 py-0.5 rounded-full bg-primary/10 text-primary text-label-sm font-label-sm">${v.tipo}</span>
            <span class="text-label-sm font-label-sm text-on-surface-variant flex items-center gap-1">
              <span class="material-symbols-outlined text-[14px]">calendar_month</span>
              ${v.dataInicioFmt}
            </span>
          </div>
          <h1 class="text-headline-lg font-headline-lg text-on-surface tracking-tight">${v.titulo}</h1>
          <p class="text-body-sm font-body-sm text-on-surface-variant mt-0.5">${v.descricao}</p>
        </div>
        <div class="flex items-center gap-space-sm self-start md:self-center">
          <div class="bg-surface-container-low p-1 rounded-full flex items-center shadow-inner">
            <button class="px-3.5 py-1.5 rounded-full bg-surface-container-lowest text-primary text-label-md font-label-md font-bold shadow-sm flex items-center gap-1.5 transition-all">
              <span class="material-symbols-outlined text-[18px]">format_list_bulleted</span>
              <span>Lista</span>
            </button>
            <button class="px-3.5 py-1.5 rounded-full text-on-surface-variant hover:text-primary text-label-md font-label-md flex items-center gap-1.5 transition-all">
              <span class="material-symbols-outlined text-[18px]">map</span>
              <span>Mapa</span>
            </button>
          </div>
          <button class="px-3.5 py-2 rounded-full border border-outline-variant/50 text-on-surface hover:bg-surface-container-high text-label-md font-label-md flex items-center gap-1.5 transition-colors duration-150 active:scale-95 shadow-sm" title="Exportar ou compartilhar roteiro">
            <span class="material-symbols-outlined text-[18px] text-primary">share</span>
            <span class="hidden sm:inline">PDF / Link</span>
          </button>
        </div>
      </div>
      <div class="mt-4 pt-4 border-t border-surface-container-high/60 flex flex-wrap items-center justify-between gap-2">
        <div class="flex items-center gap-2">
          <span class="text-label-sm font-label-sm text-on-surface-variant">Viajantes:</span>
          <div class="flex items-center -space-x-2">${avatars}${extraBadge}</div>
        </div>
        <div class="flex items-center gap-2">
          <span class="inline-flex items-center px-2 py-0.5 rounded-full text-label-sm font-label-sm bg-emerald-50 text-emerald-700 font-medium">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 mr-1.5"></span> Sincronizado agora
          </span>
        </div>
      </div>
    </section>`;

    $('viajantes-count-header').textContent = t.length + ' viajantes ativos';
  }

  /* ── Render: Dias Carousel ── */
  function renderDias() {
    const chips = dados.dias.map(d => {
      const ativo = d.numero === diaAtivo;
      return `
      <button data-dia="${d.numero}" class="shrink-0 px-4 py-2 rounded-full transition-all duration-150 active:scale-95 flex items-center gap-2 ${
        ativo
          ? 'bg-primary text-on-primary font-bold shadow-[0_4px_12px_rgba(0,101,116,0.25)] ring-2 ring-primary/20'
          : 'bg-surface-container-lowest text-on-surface-variant border border-outline-variant/40 hover:border-primary/50'
      }">
        ${ativo ? '<span class="material-symbols-outlined text-[16px]">check_circle</span>' : ''}
        <span>Dia ${d.numero}</span>
        <span class="${ativo ? 'text-primary-fixed text-xs font-normal' : 'text-outline text-xs'}">${d.dataFmt} • ${d.diaSemana}</span>
      </button>`;
    }).join('');

    $('secao-dias').innerHTML = `
    <section class="space-y-space-xs">
      <div class="flex items-center justify-between">
        <h2 class="text-label-md font-label-md uppercase tracking-wider text-on-surface-variant font-bold">Dias do Roteiro</h2>
        <span class="text-label-sm font-label-sm text-primary flex items-center gap-0.5 cursor-pointer hover:underline">
          Ver calendário completo <span class="material-symbols-outlined text-[14px]">chevron_right</span>
        </span>
      </div>
      <div class="flex items-center gap-space-sm overflow-x-auto custom-scrollbar -mx-margin px-margin py-2">${chips}</div>
    </section>`;
  }

  /* ── Render: Resumo do Dia ── */
  function renderResumo() {
    const dia = dados.dias.find(d => d.numero === diaAtivo);
    const nAtv = dados.atividades.filter(a => a.diaNumero === diaAtivo).length;
    const diaMes = dia.dataFmt.split('/')[0];
    const feriadoHtml = dia.ehFeriado && dia.feriadoNome
      ? `<span class="px-2 py-0.5 rounded-full bg-secondary-container/15 text-secondary text-label-sm font-label-sm">${dia.feriadoNome}</span>`
      : '';
    const resumoTexto = nAtv > 0
      ? `${nAtv} atividades programadas • Total: <strong class="text-on-surface font-semibold">~R$ ${dia.custoDia}/pessoa</strong>`
      : 'Dia livre — sem atividades planejadas';

    $('secao-resumo').innerHTML = `
    <section class="bg-gradient-to-r from-surface-container-high/70 via-surface-container-low to-surface-bright border border-surface-container-highest/80 rounded-xl p-space-md flex flex-col sm:flex-row sm:items-center justify-between gap-space-sm shadow-sm">
      <div class="flex items-start gap-3">
        <div class="w-10 h-10 rounded-xl bg-primary text-on-primary flex flex-col items-center justify-center shrink-0 shadow-sm">
          <span class="text-[10px] font-bold tracking-tight uppercase leading-none">${dia.diaSemana}</span>
          <span class="text-headline-sm font-headline-sm leading-none mt-0.5">${diaMes}</span>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h3 class="text-headline-sm font-headline-sm text-on-surface">${dia.dataCompleta}</h3>
            ${feriadoHtml}
          </div>
          <p class="text-body-sm font-body-sm text-on-surface-variant mt-0.5">${resumoTexto}</p>
        </div>
      </div>
      <div class="flex items-center gap-2 self-end sm:self-center">
        <button class="px-3 py-1.5 rounded-full bg-surface-container-lowest text-primary hover:bg-primary/10 text-label-sm font-label-sm font-bold border border-primary/20 transition-all flex items-center gap-1">
          <span class="material-symbols-outlined text-[16px]">tune</span>
          Reordenar
        </button>
      </div>
    </section>`;
  }

  /* ── Render: Card de Atividade ── */
  function montarAtividade(a) {
    const s = STATUS_ESTILO[a.status] || STATUS_ESTILO.flexivel;
    const borda = BORDA_NOHO[a.bordaCor] || BORDA_NOHO['outline-variant'];
    const isHighlight = a.ehDestaque;
    const noBorder = a.bordaCor === 'outline-variant' ? 'border-transparent hover:border-primary-fixed-dim/50' : `border-${a.bordaCor}/30`;
    // Direct classes for card border:
    const cardBorder = isHighlight ? 'border-secondary-container/30' : 'border-transparent hover:border-primary-fixed-dim/50';

    /* Badge de preço */
    let precoBadgeCls = 'bg-surface-container-high text-on-surface-variant text-label-sm font-label-sm font-medium';
    if (isHighlight)       precoBadgeCls = 'bg-emerald-50 text-emerald-800 text-label-sm font-label-sm font-bold';
    else if (a.status === 'flexivel') precoBadgeCls = 'bg-surface-container text-on-surface-variant text-label-sm font-label-sm';

    /* Status badge */
    let statusBadge = '';
    if (s.icon) {
      statusBadge = `<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full ${s.badgeCls} text-label-sm font-label-sm font-bold">
        <span class="material-symbols-outlined text-[14px]">${s.icon}</span> ${a.statusLabel}
      </span>`;
    } else {
      statusBadge = `<span class="px-2.5 py-0.5 rounded-full ${s.badgeCls} text-label-sm font-label-sm font-semibold">${a.statusLabel}</span>`;
    }

    /* Preço badge */
    const precoBadge = `<span class="px-2.5 py-0.5 rounded-full ${precoBadgeCls}">${a.preco}</span>`;

    /* Linha de nota / Sugerido por */
    let footerLeft = '';
    if (a.sugeridoPor) {
      footerLeft = `<div class="flex items-center gap-2 text-body-sm font-body-sm text-on-surface-variant">
        <span class="material-symbols-outlined text-[18px] text-primary">lightbulb</span>
        <span>Sugerido por <strong class="text-on-surface font-semibold">${a.sugeridoPor}</strong></span>
      </div>`;
    } else if (a.nota) {
      const iconeCor = a.nota.iconeCor === 'tertiary' ? 'text-tertiary' : 'text-' + a.nota.iconeCor;
      const textoCls = a.ehDestaque ? 'text-emerald-700 font-medium' : 'text-on-surface-variant';
      footerLeft = `<div class="flex items-center gap-2 text-body-sm font-body-sm ${textoCls}">
        <span class="material-symbols-outlined text-[18px] ${iconeCor}">${a.nota.icone}</span>
        <span>${a.nota.texto}</span>
      </div>`;
    }

    /* Footer direito: votos OU presenças */
    let footerRight = '';
    if (a.votos && a.votos.avatares) {
      footerRight = `<div class="flex items-center gap-2">
        <div class="flex items-center -space-x-2">${avatarsHtml(a.votos.avatares, 4)}</div>
        <span class="px-2 py-0.5 rounded-full bg-secondary-container/10 text-secondary text-label-sm font-label-sm font-bold">${a.votos.labelExtra}</span>
      </div>`;
    } else if (a.presentes && a.presentes.length) {
      const presLabel = a.presentesLabel
        ? `<span class="text-label-sm font-label-sm text-outline">${a.presentesLabel}</span>`
        : '';
      const presSuffix = a.presentesSuffix
        ? `<span class="text-label-sm font-label-sm text-on-surface-variant font-medium">${a.presentesSuffix}</span>`
        : '';
      footerRight = `<div class="flex items-center gap-2">
        ${presLabel}
        <div class="flex items-center -space-x-2">${avatarsHtml(a.presentes, 5)}</div>
        ${presSuffix}
      </div>`;
    }

    const pingDots = isHighlight
      ? `<span class="absolute -top-1 -right-1 w-3.5 h-3.5 bg-secondary-container rounded-full border-2 border-white animate-ping"></span>
         <span class="absolute -top-1 -right-1 w-3.5 h-3.5 bg-secondary-container rounded-full border-2 border-white"></span>`
      : '';

    return `
    <div class="group flex gap-3 md:gap-5">
      <div class="flex flex-col items-center shrink-0">
        <div class="relative w-12 h-12 md:w-16 md:h-16 rounded-2xl bg-surface-container-lowest border-2 ${borda} flex flex-col items-center justify-center shadow-md group-hover:scale-105 transition-transform bg-white">
          <span class="material-symbols-outlined text-[20px] md:text-[24px]">${a.icone}</span>
          <span class="text-[10px] md:text-label-sm font-label-sm font-bold text-on-surface">${a.horario}</span>
          ${pingDots}
        </div>
      </div>
      <div class="flex-1 bg-surface-container-lowest rounded-2xl p-space-md ${cardShadow} border ${cardBorder} transition-all">
        <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-2">
          <div>
            <div class="flex flex-wrap items-center gap-2 mb-1.5">
              ${statusBadge}
              ${precoBadge}
            </div>
            <h4 class="text-headline-sm font-headline-sm text-on-surface">${a.titulo}</h4>
            <p class="text-body-sm font-body-sm text-on-surface-variant mt-1">${a.descricao}</p>
          </div>
          <button class="w-8 h-8 rounded-full flex items-center justify-center text-outline hover:text-on-surface hover:bg-surface-container-low transition-colors self-end sm:self-start" title="Opções">
            <span class="material-symbols-outlined text-[20px]">more_vert</span>
          </button>
        </div>
        ${(footerLeft || footerRight) ? `
        <div class="mt-3 pt-3 border-t border-surface-container-low flex flex-wrap items-center justify-between gap-3">
          ${footerLeft}
          ${footerRight}
        </div>` : ''}
      </div>
    </div>`;
  }

  /* ── Render: Conexão de Trânsito ── */
  function montarConexao(c) {
    return `
    <div class="flex items-center gap-3 md:gap-5 pl-3 md:pl-5 py-1">
      <div class="w-6 flex justify-center">
        <span class="w-2.5 h-2.5 rounded-full bg-primary-fixed-dim ring-4 ring-background"></span>
      </div>
      <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container-low text-on-surface-variant text-label-sm font-label-sm shadow-xs border border-outline-variant/30">
        <span class="material-symbols-outlined text-[16px] text-primary">${c.icone}</span>
        <span>${c.texto}</span>
      </div>
    </div>`;
  }

  /* ── Render: Timeline ── */
  function renderTimeline() {
    const atvs = dados.atividades
      .filter(a => a.diaNumero === diaAtivo)
      .sort((a, b) => a.horario.localeCompare(b.horario));

    /* Sem atividades */
    if (!atvs.length) {
      $('secao-timeline').innerHTML = `
      <section class="bg-surface-container-lowest rounded-2xl p-space-lg border border-dashed border-outline-variant/40 flex flex-col items-center justify-center text-center gap-3 py-16">
        <span class="material-symbols-outlined text-[40px] text-outline">event_busy</span>
        <div>
          <h4 class="text-headline-sm font-headline-sm text-on-surface">Nenhuma atividade planejada</h4>
          <p class="text-body-sm text-on-surface-variant mt-1">Este dia está livre. Que tal sugerir um passeio para o grupo?</p>
        </div>
        <button onclick="window.location.href='votacao.html'" class="mt-1 px-5 py-2.5 rounded-full bg-primary text-on-primary text-label-md font-label-md font-bold shadow-md hover:bg-primary/90 transition-all duration-150 active:scale-95 flex items-center gap-2">
          <span class="material-symbols-outlined text-[18px]">add_circle</span>
          + Adicionar Passeio ao Dia
        </button>
      </section>`;
      return;
    }

    const itens = [];
    atvs.forEach((a, i) => {
      itens.push(montarAtividade(a));
      const conn = dados.conexoes.find(c => c.de === a.id);
      if (conn) itens.push(montarConexao(conn));
    });

    $('secao-timeline').innerHTML = `
    <section class="relative">
      <div class="absolute left-6 md:left-8 top-6 bottom-16 w-0.5 border-l-2 border-dashed border-primary-container/40 z-0"></div>
      <div class="space-y-space-lg relative z-10">${itens.join('')}</div>
    </section>`;
  }

  /* ── Render: Fechamento de Custos ── */
  function renderFechamento() {
    const v = dados.viagem;
    $('secao-fechamento').innerHTML = `
    <section class="bg-surface-container-lowest rounded-2xl p-space-md shadow-[0_12px_28px_-4px_rgba(8,131,149,0.12),0_6px_12px_-2px_rgba(10,77,104,0.06)] border border-primary-fixed-dim/40">
      <div class="flex flex-col md:flex-row items-center justify-between gap-space-md">
        <div class="w-full md:w-auto flex items-center gap-4">
          <div class="w-12 h-12 rounded-2xl bg-primary/10 text-primary flex items-center justify-center shrink-0">
            <span class="material-symbols-outlined text-[28px]">account_balance_wallet</span>
          </div>
          <div>
            <span class="text-label-sm font-label-sm uppercase tracking-wider text-on-surface-variant font-bold block">Fechamento do Grupo</span>
            <div class="flex items-baseline gap-2 mt-0.5">
              <span class="text-headline-lg font-headline-lg text-on-surface">R$ ${v.custoTotal.toLocaleString('pt-BR')}</span>
              <span class="text-body-md font-body-md text-primary font-bold">(R$ ${v.custoPorPessoa} por pessoa)</span>
            </div>
            <p class="text-body-sm font-body-sm text-on-surface-variant">${v.descricaoCusto}</p>
          </div>
        </div>
        <div class="w-full md:w-auto flex items-center gap-2">
          <button class="w-full md:w-auto px-6 py-3 rounded-full bg-secondary-container text-on-secondary text-label-lg font-label-lg font-bold shadow-md hover:bg-secondary transition-all duration-150 active:scale-95 flex items-center justify-center gap-2" onclick="window.location.href='votacao.html'">
            <span class="material-symbols-outlined text-[20px]">add_circle</span>
            <span>+ Adicionar Passeio ao Dia</span>
          </button>
        </div>
      </div>
    </section>`;
  }

  /* ── Render All ── */
  function renderTudo() {
    renderHeader();
    renderDias();
    renderResumo();
    renderTimeline();
    renderFechamento();
  }

  /* ── Delegação de Eventos ── */
  function bindEvents() {
    $('secao-dias').addEventListener('click', function(e) {
      const btn = e.target.closest('[data-dia]');
      if (!btn) return;
      diaAtivo = parseInt(btn.dataset.dia, 10);
      renderDias();
      renderResumo();
      renderTimeline();
      renderFechamento();
    });

    // Pulse effect on timeline cards
    $('secao-timeline').addEventListener('click', function(e) {
      const card = e.target.closest('.group');
      if (!card || e.target.closest('button')) return;
      card.classList.add('scale-[1.008]');
      setTimeout(() => card.classList.remove('scale-[1.008]'), 180);
    });
  }

  /* ── Inicialização ── */
  async function init() {
    try {
      const res = await fetch(JSON_PATH, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      dados = await res.json();
      diaAtivo = dados.viagem.diaAtivo;

      $('loading-state').classList.add('hidden');
      $('conteudo').classList.remove('hidden');
      renderTudo();
      bindEvents();
    } catch (err) {
      $('loading-state').classList.add('hidden');
      $('erro-state').classList.remove('hidden');
      const hint = location.protocol === 'file:'
        ? 'Este navegador bloqueia a leitura de JSON via file://. Abra esta página por um servidor local: <code>cd /root/trip && python3 -m http.server</code> e acesse <code>http://localhost:8000/dia-a-dia.html</code>.'
        : 'Detalhes: ' + err.message;
      $('erro-mensagem').innerHTML = hint;
    }
  }

  document.addEventListener('DOMContentLoaded', init);

})();
</script>
</body>
</html>
